spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# logging.level.root=DEBUG
logging.level.org.springframework.ai=DEBUG

# Reference your .env keys normally
spring.ai.openai.base-url=${BASE_URL}
spring.ai.openai.api-key=${OPEN_AI_API_SECRET}
spring.ai.openai.chat.model=${MODEL_NAME}


spring.ai.openai.embedding.enabled=${EMBEDDING_ENABLED}


# The NVIDIA LLM API requires this parameter to be set explicitly or server internal error will be thrown.
spring.ai.openai.chat.max-tokens=2048